<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f4959" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="2logical ID" />
  <link rel="apple-touch-icon" href="assets/icon-180.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>2logical ID</title>
  <style>
    :root {
      --navy: #0f4959;
      --navy-deep: #082f3c;
      --lime: #8dc63f;
      --bg: #071e26;
      --text: #f7fafb;
      --muted: rgba(247,250,251,.7);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; }
    body { min-height: 100svh; overflow-x: hidden; }
    .app {
      min-height: 100svh;
      padding: max(14px, env(safe-area-inset-top)) 14px max(18px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      background:
        radial-gradient(circle at 50% -15%, rgba(141,198,63,.13), transparent 40%),
        linear-gradient(180deg, #0a2c37 0%, #071e26 46%, #04161d 100%);
    }
    header {
      width: min(100%, 520px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 5px 2px 12px;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand-mark { width: 38px; height: 38px; border-radius: 10px; overflow: hidden; background: white; box-shadow: 0 5px 14px rgba(0,0,0,.22); flex: 0 0 auto; }
    .brand-mark img { width: 100%; height: 100%; object-fit: cover; }
    h1 { font-size: 18px; margin: 0; letter-spacing: -.02em; }
    .subtitle { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
    .status { font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--lime); background: rgba(141,198,63,.1); border: 1px solid rgba(141,198,63,.35); padding: 7px 9px; border-radius: 999px; white-space: nowrap; }

    .stage { width: min(100%, 520px); flex: 1; display: grid; place-items: center; padding: 2px 0 10px; }
    .card-wrap { width: min(90vw, 420px); aspect-ratio: 2 / 3; perspective: 1500px; touch-action: manipulation; }
    .card { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .52s cubic-bezier(.22,.75,.25,1); }
    .card.flipped { transform: rotateY(180deg); }
    .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 25px; overflow: hidden; box-shadow: 0 22px 50px rgba(0,0,0,.42), 0 0 0 1px rgba(255,255,255,.08); background: white; }
    .face.back { transform: rotateY(180deg); }
    .face img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .tap-hint { position: absolute; bottom: 13px; left: 50%; transform: translateX(-50%); z-index: 5; background: rgba(3,22,29,.74); color: white; font-size: 11px; font-weight: 600; letter-spacing: .02em; padding: 7px 11px; border-radius: 999px; backdrop-filter: blur(10px); pointer-events: none; opacity: .82; }

    .controls { width: min(100%, 520px); display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 2px; }
    button { appearance: none; border: 0; border-radius: 14px; min-height: 48px; font: inherit; font-weight: 700; letter-spacing: -.01em; cursor: pointer; }
    .primary { background: var(--lime); color: #0a2d37; box-shadow: 0 8px 20px rgba(141,198,63,.18); }
    .secondary { color: white; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.10); }
    .primary:active, .secondary:active { transform: scale(.985); }
    .footer { width: min(100%, 520px); text-align: center; color: var(--muted); font-size: 11px; line-height: 1.35; padding-top: 11px; }

    @media (max-height: 730px) {
      .card-wrap { width: min(72vw, 330px); }
      .stage { padding-bottom: 5px; }
      .footer { display: none; }
    }
    @media (orientation: landscape) and (max-height: 520px) {
      .app { display: grid; grid-template-columns: 1fr minmax(260px, 360px); grid-template-rows: auto 1fr; column-gap: 18px; }
      header { grid-column: 1; align-self: start; }
      .stage { grid-column: 2; grid-row: 1 / span 2; width: 100%; }
      .card-wrap { width: min(42vh, 300px); }
      .controls, .footer { grid-column: 1; width: 100%; align-self: end; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand">
        <div class="brand-mark"><img src="assets/icon-180.png" alt="2logical logo"></div>
        <div>
          <h1>2logical ID</h1>
          <p class="subtitle">Justin Phillips · Consultant</p>
        </div>
      </div>
      <div class="status">OFFLINE READY</div>
    </header>

    <section class="stage" aria-label="Employee badge">
      <div class="card-wrap" id="cardWrap" role="button" tabindex="0" aria-label="Tap to flip badge">
        <div class="card" id="card">
          <div class="face front"><img src="assets/badge-front.png" alt="Front of employee badge"></div>
          <div class="face back"><img src="assets/badge-back.png" alt="Back of employee badge with QR access code"></div>
        </div>
        <div class="tap-hint" id="tapHint">Tap card to flip</div>
      </div>
    </section>

    <section class="controls" aria-label="Badge controls">
      <button class="primary" id="flipBtn">Show Back</button>
      <button class="secondary" id="fullBtn">Full Screen</button>
    </section>
    <div class="footer">Add this page to your iPhone Home Screen for a full-screen app experience.</div>
  </main>

<script>
  const card = document.getElementById('card');
  const wrap = document.getElementById('cardWrap');
  const flipBtn = document.getElementById('flipBtn');
  const fullBtn = document.getElementById('fullBtn');
  let flipped = false;

  function setFlip(next) {
    flipped = next;
    card.classList.toggle('flipped', flipped);
    flipBtn.textContent = flipped ? 'Show Front' : 'Show Back';
  }
  function flip() { setFlip(!flipped); }
  wrap.addEventListener('click', flip);
  wrap.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); }});
  flipBtn.addEventListener('click', flip);
  fullBtn.addEventListener('click', async () => {
    try {
      if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    } catch (_) {
      window.scrollTo({top: 0, behavior: 'smooth'});
    }
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js'));
  }
</script>
</body>
</html>
